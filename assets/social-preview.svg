<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Xiaomi Air Fryer for Home Assistant — local control, no cloud after setup, 24 models, 14 languages">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B2B"/><stop offset="55%" stop-color="#10293F"/><stop offset="100%" stop-color="#0A2233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#41BDF5"/><stop offset="100%" stop-color="#3DDC97"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.85"/><stop offset="100%" stop-color="#FFC107" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#accent)"/>
  <g stroke="#41BDF5" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280"/>
    <path d="M160 0V640M320 0V640M960 0V640M1120 0V640"/>
  </g>

  <text x="96" y="232" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="76" font-weight="700" fill="#F2F8FC">Xiaomi Air Fryer</text>
  <text x="96" y="296" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="36" font-weight="500" fill="#41BDF5">for Home Assistant</text>
  <text x="96" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" fill="#9FB6C6">Set time, temperature and recipe from your dashboard.</text>
  <text x="96" y="388" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="23" fill="#9FB6C6">Runs locally once set up.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="600">
    <rect x="96" y="428" width="188" height="44" rx="22" fill="#3DDC97" fill-opacity="0.12" stroke="#3DDC97" stroke-opacity="0.45"/>
    <text x="190" y="456" fill="#86E9BE" text-anchor="middle">24 models</text>
    <rect x="300" y="428" width="206" height="44" rx="22" fill="#41BDF5" fill-opacity="0.12" stroke="#41BDF5" stroke-opacity="0.45"/>
    <text x="403" y="456" fill="#8FD6F7" text-anchor="middle">14 languages</text>
    <rect x="522" y="428" width="188" height="44" rx="22" fill="#7C7CF5" fill-opacity="0.12" stroke="#7C7CF5" stroke-opacity="0.45"/>
    <text x="616" y="456" fill="#B3B3FA" text-anchor="middle">HACS</text>
  </g>

  <g transform="translate(940 196)">
    <rect x="0" y="44" width="244" height="212" rx="26" fill="#16202B" stroke="#28394A" stroke-width="2"/>
    <rect x="22" y="70" width="200" height="74" rx="14" fill="#0F1720" stroke="#28394A"/>
    <text x="122" y="108" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="32" font-weight="700" fill="#41BDF5" text-anchor="middle">180 &#176;C</text>
    <text x="122" y="132" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#9FB6C6" text-anchor="middle">15 min</text>
    <rect x="22" y="160" width="200" height="12" rx="6" fill="#28394A"/>
    <rect x="22" y="160" width="140" height="12" rx="6" fill="url(#accent)"/>
    <circle cx="60" cy="210" r="17" fill="#0F1720" stroke="#3DDC97" stroke-width="2"/>
    <circle cx="122" cy="210" r="17" fill="#0F1720" stroke="#41BDF5" stroke-width="2"/>
    <circle cx="184" cy="210" r="17" fill="#0F1720" stroke="#FFC107" stroke-width="2"/>
    <path d="M56 8 c10 -12 -10 -20 0 -34 c7 -9 2 -14 0 -18" stroke="url(#heat)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M122 12 c10 -13 -10 -22 0 -37 c7 -10 2 -15 0 -20" stroke="url(#heat)" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M188 8 c10 -12 -10 -20 0 -34 c7 -9 2 -14 0 -18" stroke="url(#heat)" stroke-width="7" stroke-linecap="round" fill="none"/>
