<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Xiaomi Air Fryer for Home Assistant — local control with sensors, sliders and recipe selection, no cloud after setup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1B2B"/>
      <stop offset="55%" stop-color="#10293F"/>
      <stop offset="100%" stop-color="#0A2233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#41BDF5"/>
      <stop offset="100%" stop-color="#3DDC97"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent)"/>

  <g stroke="#41BDF5" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200"/>
    <path d="M120 0V400M280 0V400M440 0V400M860 0V400M1020 0V400"/>
  </g>

  <text x="72" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#F2F8FC">Xiaomi Air Fryer</text>
  <text x="72" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="27" font-weight="500" fill="#41BDF5">for Home Assistant</text>
  <text x="72" y="234" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#9FB6C6">Local miIO control &#183; set time, temperature and recipe &#183; 28 models &#183; 14 languages</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600">
    <rect x="72" y="266" width="152" height="34" rx="17" fill="#3DDC97" fill-opacity="0.12" stroke="#3DDC97" stroke-opacity="0.45"/>
    <text x="148" y="288" fill="#86E9BE" text-anchor="middle">No cloud needed</text>
    <rect x="236" y="266" width="138" height="34" rx="17" fill="#41BDF5" fill-opacity="0.12" stroke="#41BDF5" stroke-opacity="0.45"/>
    <text x="305" y="288" fill="#8FD6F7" text-anchor="middle">QR sign&#8209;in</text>
    <rect x="386" y="266" width="164" height="34" rx="17" fill="#41BDF5" fill-opacity="0.12" stroke="#41BDF5" stroke-opacity="0.45"/>
    <text x="468" y="288" fill="#8FD6F7" text-anchor="middle">Full control</text>
    <rect x="562" y="266" width="132" height="34" rx="17" fill="#7C7CF5" fill-opacity="0.12" stroke="#7C7CF5" stroke-opacity="0.45"/>
    <text x="628" y="288" fill="#B3B3FA" text-anchor="middle">HACS ready</text>
  </g>

  <!-- stylised fryer with a control panel -->
  <g transform="translate(872 96)">
    <rect x="0" y="36" width="216" height="180" rx="22" fill="#16202B" stroke="#28394A" stroke-width="2"/>
    <rect x="18" y="58" width="180" height="62" rx="12" fill="#0F1720" stroke="#28394A"/>
    <text x="108" y="90" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="26" font-weight="700" fill="#41BDF5" text-anchor="middle">180 &#176;C</text>
    <text x="108" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#9FB6C6" text-anchor="middle">15 min</text>
    <rect x="18" y="134" width="180" height="10" rx="5" fill="#28394A"/>
    <rect x="18" y="134" width="126" height="10" rx="5" fill="url(#accent)"/>
    <circle cx="52" cy="176" r="15" fill="#0F1720" stroke="#3DDC97" stroke-width="2"/>
    <circle cx="108" cy="176" r="15" fill="#0F1720" stroke="#41BDF5" stroke-width="2"/>
    <circle cx="164" cy="176" r="15" fill="#0F1720" stroke="#FFC107" stroke-width="2"/>
    <path d="M48 4 c9 -10 -9 -18 0 -30 c6 -8 2 -12 0 -16" stroke="url(#heat)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M108 8 c9 -11 -9 -20 0 -33 c6 -9 2 -13 0 -18" stroke="url(#heat)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M168 4 c9 -10 -9 -18 0 -30 c6 -8 2 -12 0 -16" stroke="url(#heat)" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
