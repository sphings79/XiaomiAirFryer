<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="Three ways to obtain the device token: QR sign-in, app backup, or entering it by hand">
  <title>Three ways to set up an air fryer</title>

  <style>
    .bg    { fill: #f6f8fa; }
    .card  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .accent{ fill: #1f6feb; }
    .head  { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .body  { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .tag   { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #ffffff; }
    .arrow { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .goal  { fill: #dafbe1; stroke: #2da44e; stroke-width: 1.5; }
    .goaltx{ font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1a7f37; }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="250" rx="8"/>

  <!-- option 1 -->
  <rect class="card" x="24" y="24" width="216" height="112" rx="8"/>
  <rect class="accent" x="24" y="24" width="216" height="26" rx="8"/>
  <rect class="accent" x="24" y="40" width="216" height="10"/>
  <text class="tag" x="38" y="42">RECOMMENDED</text>
  <text class="head" x="38" y="76">Scan a QR code</text>
  <text class="body" x="38" y="98">Sign in to the Xiaomi cloud.</text>
  <text class="body" x="38" y="116">Any QR scanner works, the</text>
  <text class="body" x="38" y="130">Mi Home app is not required.</text>

  <!-- option 2 -->
  <rect class="card" x="272" y="24" width="216" height="112" rx="8"/>
  <text class="head" x="286" y="54">Mi Home backup</text>
  <text class="body" x="286" y="78">Upload an .ab backup or an</text>
  <text class="body" x="286" y="94">extracted miio2.db.</text>
  <text class="body" x="286" y="116">Nothing is sent to Xiaomi.</text>

  <!-- option 3 -->
  <rect class="card" x="520" y="24" width="216" height="112" rx="8"/>
  <text class="head" x="534" y="54">Address and token</text>
  <text class="body" x="534" y="78">Enter the IP address and the</text>
  <text class="body" x="534" y="94">32 character token yourself,</text>
  <text class="body" x="534" y="116">if you already have them.</text>

  <!-- arrows down to the shared result -->
  <path class="arrow" d="M132 136 L132 168 L380 168"/>
  <path class="arrow" d="M380 136 L380 168"/>
  <path class="arrow" d="M628 136 L628 168 L380 168"/>
  <path class="arrow" d="M380 168 L380 186" marker-end="url(#tip)"/>
  <defs>
    <marker id="tip" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- result -->
  <rect class="goal" x="228" y="192" width="304" height="40" rx="8"/>
  <text class="goaltx" x="380" y="217" text-anchor="middle">The fryer runs fully locally afterwards</text>
</svg>
