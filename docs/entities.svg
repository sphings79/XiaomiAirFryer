<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="Entities the integration provides: sensors for reading, and controls for operating the fryer">
  <title>What the integration provides</title>

  <style>
    .bg     { fill: #f6f8fa; }
    .card   { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .head   { font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .sub    { font: 400 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8c959f; }
    .item   { font: 400 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
    .pill   { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
    .pilltx { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0969da; }
    .ctl    { fill: #fff8c5; stroke: #d4a72c; stroke-width: 1; }
    .ctltx  { font: 600 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #7d4e00; }
    .note   { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #57606a; }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="330" rx="8"/>

  <!-- reading -->
  <rect class="card" x="24" y="24" width="344" height="228" rx="8"/>
  <rect class="pill" x="40" y="40" width="66" height="20" rx="10"/>
  <text class="pilltx" x="73" y="54" text-anchor="middle">sensor</text>
  <text class="head" x="40" y="86">Reading</text>
  <text class="sub" x="40" y="104">unavailable when the fryer is unplugged</text>

  <text class="item" x="40" y="132">Status, remaining time and percentage</text>
  <text class="item" x="40" y="154">Target time and temperature</text>
  <text class="item" x="40" y="176">Recipe, food quantity, preheat phase</text>
  <text class="item" x="40" y="198">Turn-food prompt and reminder setting</text>
  <text class="item" x="40" y="220">Delayed start and its remaining time</text>

  <!-- operating -->
  <rect class="card" x="392" y="24" width="344" height="228" rx="8"/>
  <rect class="ctl" x="408" y="40" width="168" height="20" rx="10"/>
  <text class="ctltx" x="492" y="54" text-anchor="middle">number · select · switch · button</text>
  <text class="head" x="408" y="86">Operating</text>
  <text class="sub" x="408" y="104">stay usable while the fryer is off</text>

  <text class="item" x="408" y="132">Target time, temperature, delayed start</text>
  <text class="item" x="408" y="154">Recipe by name, not M1 or M2</text>
  <text class="item" x="408" y="176">Food quantity</text>
  <text class="item" x="408" y="198">Preheat and turn-food reminder</text>
  <text class="item" x="408" y="220">Start, stop, pause, resume</text>

  <text class="note" x="24" y="284">Each entity only appears where the model actually supports it.</text>
  <text class="note" x="24" y="306">Names and states are translated into 14 languages; the eleven services are unchanged.</text>
</svg>
