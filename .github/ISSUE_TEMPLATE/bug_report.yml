name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: model
    attributes:
      label: Fryer model
      description: The model name, as shown in the Mi Home app under device info.
      placeholder: careli.fryer.maf05a
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.9.2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: >-
        Settings → System → Logs, filtered for xiaomi_airfryer. Remove your
        token before pasting.
      render: text
